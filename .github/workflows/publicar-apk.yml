name: Publicar APK (link direto)
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "ID da build Android"
        required: true
      artefato:
        description: "Nome do artefato"
        required: false
        default: "app-release-preview"
permissions:
  contents: write
  actions: read
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar APK da build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download "${{ inputs.run_id }}" -R "${{ github.repository }}" -n "${{ inputs.artefato }}" -D apk
          ls -la apk
          F="$(ls apk/*.apk apk/*.aab 2>/dev/null | head -1)"
          echo "ARQ=LUPI.${F##*.}" >> "$GITHUB_ENV"
          mv "$F" "LUPI.${F##*.}"
      - name: Publicar como release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="apk-${{ inputs.run_id }}"
          gh release create "$TAG" "$ARQ" -R "${{ github.repository }}" --title "LUPI (teste) ${{ inputs.run_id }}" --notes "Arquivo do LUPI ($ARQ). by Lucas Alberto"
